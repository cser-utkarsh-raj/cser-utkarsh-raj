<svg xmlns="http://www.w3.org/2000/svg" width="440" height="260" viewBox="0 0 440 260" role="img" aria-label="GitHub contribution activity chart">
<rect width="440" height="260" rx="18" fill="#0D1117"/>
<style>.title{font:600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#E6EDF3}.sub{font:400 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#8B949E}</style>
<text x="24" y="32" class="title">GitHub activity</text>
<circle cx="140" cy="125" r="82" fill="none" stroke="#21262D" stroke-width="28"/>
<circle cx="140" cy="125" r="48" fill="#0D1117"/>
<text x="140" y="121" text-anchor="middle" class="title">Updating</text>
<text x="140" y="141" text-anchor="middle" class="sub">from GitHub</text>
<text x="282" y="112" class="sub">Commits · Pull requests</text>
<text x="282" y="136" class="sub">Issues · Reviews</text>
<text x="24" y="238" class="sub">Updated automatically by GitHub Actions</text>
</svg>