<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D12"/>
      <stop offset=".55" stop-color="#10171D"/>
      <stop offset="1" stop-color="#0A0D13"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="60" x2="700" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E0CC"/>
      <stop offset="1" stop-color="#A99AFB"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="matrix(400 0 0 220 1000 60)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7968D8" stop-opacity=".18"/>
      <stop offset="1" stop-color="#7968D8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#C5D0D9" stroke-opacity=".055"/>
    </pattern>
    <style>
      .sans{font-family:Inter,'Plus Jakarta Sans',Arial,sans-serif}
      .mono{font-family:'JetBrains Mono',Consolas,monospace}
      .pulse{animation:pulse 4s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="22" fill="url(#aura)"/>
  <path d="M810 0H1200V320H1010C1080 245 1080 118 810 0Z" fill="#151D25" fill-opacity=".42"/>
  <path d="M850 0C1015 75 1080 185 1040 320" stroke="url(#accent)" stroke-opacity=".2"/>
  <path d="M910 0C1075 75 1140 185 1100 320" stroke="#DCE6ED" stroke-opacity=".07"/>
  <path d="M970 0C1135 75 1200 185 1160 320" stroke="#DCE6ED" stroke-opacity=".05"/>
  <rect x="64" y="54" width="4" height="212" rx="2" fill="url(#accent)"/>
  <text class="mono" x="91" y="77" font-size="12" letter-spacing="3.2" fill="#91A0AD">INDEPENDENT DEVELOPER  /  INDIA</text>
  <text class="sans" x="86" y="157" font-size="65" font-weight="750" letter-spacing="-2.8" fill="#F4F7FA">Utkarsh Raj</text>
  <text class="sans" x="91" y="198" font-size="21" font-weight="500" fill="#C4CDD5">Software Engineer <tspan fill="#596975">·</tspan> Full-stack Developer</text>
  <text class="mono" x="91" y="239" font-size="13" fill="#82929F">I build software, tools, and experiments that solve real problems.</text>
  <g transform="translate(92 274)">
    <circle class="pulse" cx="4" cy="0" r="3.5" fill="#55E0CC"/>
    <text class="mono" x="17" y="4" font-size="10" letter-spacing="2" fill="#6F858F">PYTHON  ·  TYPESCRIPT  ·  JAVA</text>
  </g>
  <g transform="translate(1034 108)">
    <circle r="54" stroke="#A99AFB" stroke-opacity=".14"/>
    <circle r="38" stroke="#55E0CC" stroke-opacity=".22"/>
    <circle r="21" stroke="#E6EDF2" stroke-opacity=".15"/>
    <circle r="5" fill="url(#accent)"/>
    <circle cx="0" cy="-54" r="3" fill="#A99AFB"/>
    <circle cx="38" cy="0" r="2.5" fill="#55E0CC"/>
  </g>
  <text class="mono" x="1136" y="278" text-anchor="end" font-size="10" letter-spacing="2" fill="#596975">BUILD / SHIP / LEARN</text>
  <rect x=".5" y=".5" width="1199" height="319" rx="21.5" stroke="#E7EEF4" stroke-opacity=".1"/>
