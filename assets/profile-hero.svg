<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" fill="none">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#080A0F"/><stop offset="0.5" stop-color="#10151A"/><stop offset="1" stop-color="#080A0F"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#20B2AA" stop-opacity=".34"/><stop offset="1" stop-color="#20B2AA" stop-opacity="0"/></radialGradient>
  <radialGradient id="glow2"><stop stop-color="#9F7FF7" stop-opacity=".28"/><stop offset="1" stop-color="#9F7FF7" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
  <style>
    .sans{font-family:'Google Sans','Plus Jakarta Sans',Arial,sans-serif}.mono{font-family:'JetBrains Mono',monospace}
    .float{animation:float 7s ease-in-out infinite}.pulse{animation:pulse 3.2s ease-in-out infinite}.scan{animation:scan 5s linear infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
    @keyframes scan{0%{transform:translateX(-420px)}100%{transform:translateX(1200px)}}
  </style>
</defs>
