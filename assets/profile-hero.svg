<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Utkarsh Raj — Software Engineer</title>
  <desc id="desc">Minimal dark portfolio banner with typography and a restrained abstract grid.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A0F"/>
      <stop offset="1" stop-color="#11121B"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="0" x2="460" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6A5FF"/>
      <stop offset="1" stop-color="#7C6CF0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#B7B4D8" stroke-opacity=".055"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(280 0 0 220 1000 80)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7562D8" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7562D8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>
  <path d="M0 276H1200" stroke="#FFFFFF" stroke-opacity=".08"/>
  <path d="M64 58V258" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <text x="88" y="76" font-family="monospace" font-size="12" letter-spacing="3" fill="#9B96B8">SOFTWARE ENGINEER / INDIA</text>
  <text x="82" y="157" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2.5" fill="#F5F3FF">Utkarsh Raj</text>
  <text x="88" y="197" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#C7C4D7">Full-stack developer building useful software.</text>
  <g font-family="monospace" font-size="11" letter-spacing="1.3">
    <rect x="88" y="224" width="102" height="28" rx="5" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="139" y="242" text-anchor="middle" fill="#D9D3FF">PYTHON</text>
    <rect x="200" y="224" width="126" height="28" rx="5" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="263" y="242" text-anchor="middle" fill="#D9D3FF">TYPESCRIPT</text>
    <rect x="336" y="224" width="72" height="28" rx="5" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".12"/>
    <text x="372" y="242" text-anchor="middle" fill="#D9D3FF">JAVA</text>
  </g>
  <g opacity=".85">
    <rect x="862" y="64" width="254" height="190" rx="12" stroke="#B8ACFF" stroke-opacity=".2"/>
    <path d="M887 95H1090M887 118H1040M887 141H1070M887 164H1018M887 187H1060M887 210H1000" stroke="#B8ACFF" stroke-opacity=".18" stroke-linecap="round"/>
    <circle cx="1082" cy="95" r="4" fill="#B5A4FF"/>
    <circle cx="1032" cy="141" r="4" fill="#B5A4FF" fill-opacity=".75"/>
    <circle cx="1024" cy="187" r="4" fill="#B5A4FF" fill-opacity=".5"/>
    <path d="M1098 225H1128" stroke="#B5A4FF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="88" y="294" font-family="monospace" font-size="10" letter-spacing="2" fill="#77748E">BUILD  /  DEBUG  /  SHIP</text>
  <text x="1114" y="294" text-anchor="end" font-family="monospace" font-size="10" letter-spacing="1.5" fill="#77748E">INDEPENDENTLY CURIOUS</text>
  <rect x=".5" y=".5" width="1199" height="319" rx="17.5" stroke="#FFFFFF" stroke-opacity=".1"/>
