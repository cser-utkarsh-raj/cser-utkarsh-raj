<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#09090b"/>
    <stop offset="55%" stop-color="#111827"/>
    <stop offset="100%" stop-color="#17113b"/>
  </linearGradient>
  <radialGradient id="glow"><stop stop-color="#8b5cf6" stop-opacity=".42"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee" stop-opacity="0"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  <style>
    .grid{stroke:#ffffff;stroke-opacity:.055;stroke-width:1}
    .orb{animation:float 7s ease-in-out infinite}
    .orb2{animation:float 9s ease-in-out infinite reverse}
    .pulse{animation:pulse 3s ease-in-out infinite}
    .scan{animation:scan 5s linear infinite}
    @keyframes float{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-16px)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}
    @keyframes scan{0%{transform:translateX(-500px)}100%{transform:translateX(1500px)}}
  </style>
</defs>
<rect width="1200" height="360" rx="28" fill="url(#bg)"/>
<g opacity=".65">
  <path class="grid" d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
  <path class="grid" d="M80 0V360M180 0V360M280 0V360M380 0V360M480 0V360M580 0V360M680 0V360M780 0V360M880 0V360M980 0V360M1080 0V360"/>
</g>
<circle class="orb" cx="1030" cy="80" r="170" fill="url(#glow)" filter="url(#blur)"/>
<circle class="orb2" cx="190" cy="300" r="145" fill="url(#glow)" filter="url(#blur)"/>
<g class="pulse" fill="none" stroke="#a78bfa" stroke-opacity=".45">
  <circle cx="1030" cy="80" r="55"/><circle cx="1030" cy="80" r="78"/><circle cx="1030" cy="80" r="101"/>
</g>
<g fill="#fff">
  <circle cx="93" cy="75" r="1.5" opacity=".7"/><circle cx="170" cy="155" r="1" opacity=".5"/><circle cx="1080" cy="235" r="1.4" opacity=".6"/><circle cx="1130" cy="120" r="1" opacity=".7"/><circle cx="920" cy="310" r="1.2" opacity=".5"/>
</g>
<g transform="translate(82 78)">
  <text x="0" y="0" fill="#a78bfa" font-family="monospace" font-size="16" letter-spacing="5">BUILDING .DOT</text>
  <text x="0" y="72" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">UTKARSH RAJ</text>
  <text x="2" y="112" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="21">Software Engineer  ·  Builder  ·  Product Engineer</text>
  <rect x="0" y="146" width="390" height="2" fill="url(#line)"/>
  <text x="0" y="184" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="16">small ideas → working software → shipped products</text>
</g>
<g class="scan"><rect x="0" y="0" width="260" height="1" fill="url(#line)" opacity=".65"/></g>
<g transform="translate(1015 230)">
  <circle cx="0" cy="0" r="42" fill="#09090b" stroke="#8b5cf6" stroke-width="2"/>
  <text x="0" y="9" text-anchor="middle" fill="#fff" font-family="monospace" font-size="28" font-weight="700">.dot</text>
</g>
</svg>