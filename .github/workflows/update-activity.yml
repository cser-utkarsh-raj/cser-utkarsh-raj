name: Update GitHub Activity

on:
  push:
    paths-ignore:
      - "assets/github-activity.svg"
  workflow_dispatch:
  schedule:
    - cron: "17 0 * * 1"

permissions:
  contents: write

jobs:
  update-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate activity chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_activity.py

      - name: Commit updated chart
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: update GitHub activity chart"
          git push
