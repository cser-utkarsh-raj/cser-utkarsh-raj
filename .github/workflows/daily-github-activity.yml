name: Update GitHub Activity

on:
  schedule:
    # 01:00 IST (19:30 UTC on the previous day)
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate daily activity SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_github_activity.py

      - name: Commit updated activity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-activity.svg
          if git diff --cached --quiet; then
            echo "No activity change; nothing to commit."
            exit 0
          fi
          git commit -m "chore: update daily GitHub activity"
          git push
